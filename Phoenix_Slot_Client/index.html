<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix Slot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Phoenix High-Volatility Slot</h1>
        <canvas id="slot-canvas" width="500" height="300"></canvas>
        <div id="controls">
            <button id="spin-button">SPIN</button>
            <div id="bet-controls">
                <label for="bet-select">Bet:</label>
                <select id="bet-select">
                    <option value="0.20">0.20</option>
                    <option value="0.40">0.40</option>
                    <option value="0.60">0.60</option>
                    <option value="1.00" selected>1.00</option>
                    <option value="2.00">2.00</option>
                    <option value="5.00">5.00</option>
                    <option value="10.00">10.00</option>
                </select>
                <input type="checkbox" id="ante-bet-checkbox">
                <label for="ante-bet-checkbox">Ante Bet (+30%)</label>
            </div>
            <div id="balance-display">
                Balance: <span id="balance-amount">100.00</span>
            </div>
        </div>
        <div id="buy-feature-controls">
            <button id="buy-freespins-button">Buy Free Spins (100x)</button>
            <button id="buy-respin-button">Buy Money Respin (80x)</button>
        </div>
    </div>
    <script src="slot_renderer.js"></script>
    <script src="game_controller.js"></script>
</body>
</html>
