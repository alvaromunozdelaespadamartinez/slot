<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular 5-Reel Slot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="credit-display">
        Saldo: <span id="saldo">100</span>
    </div>

    <div class="slot-machine">
        <div id="bonus-bar">
            <div class="bonus-slot"></div>
            <div class="bonus-slot"></div>
            <div class="bonus-slot"></div>
        </div>
        <div class="reels">
            <div class="reel" id="reel-1"></div>
            <div class="reel" id="reel-2"></div>
            <div class="reel" id="reel-3"></div>
            <div class="reel" id="reel-4"></div>
            <div class="reel" id="reel-5"></div>
        </div>
        <div class="controls">
            <button id="botonGirar">Girar</button>
            <button id="recharge-button">Recargar</button>
            <button id="buy-bonus-button">Compra de Bono</button>
        </div>
        <div id="bet-selector">
            <span>Apuesta:</span>
            <button class="bet-option" data-bet="10">10</button>
            <button class="bet-option" data-bet="50">50</button>
            <button class="bet-option" data-bet="90">90</button>
            <button class="bet-option" data-bet="130">130</button>
            <button class="bet-option" data-bet="170">170</button>
            <button class="bet-option" data-bet="210">210</button>
            <button class="bet-option" data-bet="250">250</button>
        </div>
        <div class="stats">
            <p>Apuesta Actual: <span id="bet-display">10</span></p>
            <p id="mensaje"></p>
        </div>
    </div>

    <div id="recharge-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Seleccione la cantidad de créditos a añadir:</h2>
            <button id="recharge-100" data-amount="100">100 Créditos</button>
            <button id="recharge-1000" data-amount="1000">1000 Créditos</button>
            <button id="recharge-10000" data-amount="10000">10000 Créditos</button>
            <button id="close-modal">Cerrar</button>
        </div>
    </div>

    <div id="buy-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Compra de Bono</h2>
            <p>Elige la cantidad de scatters para iniciar la ronda de bonificación:</p>
            <button class="buy-option" data-scatters="3">3 Scatters (Costo: <span class="cost-display"></span>)</button>
            <button class="buy-option" data-scatters="5">5 Scatters (Costo: <span class="cost-display"></span>)</button>
            <button id="close-buy-modal">Cerrar</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
