<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modular 5-Reel Slot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slot-machine">
        <div class="reels">
            <div class="reel" id="reel-1"></div>
            <div class="reel" id="reel-2"></div>
            <div class="reel" id="reel-3"></div>
            <div class="reel" id="reel-4"></div>
            <div class="reel" id="reel-5"></div>
        </div>
        <div class="controls">
            <button id="botonGirar">Girar</button>
        </div>
        <div class="stats">
            <p>Saldo: <span id="saldo">100</span></p>
            <p id="mensaje"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
